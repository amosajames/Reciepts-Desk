<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipts Desk</title><link rel="apple-touch-icon" href="icon.png"><style> *{box-sizing:border-box}body{margin:0;background:#f4f7f1;color:#173e30;font:16px system-ui}main{max-width:800px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:12px;font-weight:750}header img{width:44px;border-radius:10px}h1{font-size:32px;letter-spacing:-1px;margin:32px 0 8px}p{line-height:1.5;color:#52665b}nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:24px 0}nav a{display:flex;align-items:center;gap:10px;padding:16px 12px;background:white;border:1px solid #d5dfd4;border-radius:14px;text-decoration:none;color:#173e30;font-weight:650}nav img{width:24px;height:24px}section{background:white;border:1px solid #d5dfd4;border-radius:16px;padding:18px;margin-top:16px}label{display:block;margin:12px 0 5px;font-weight:600}input,select,textarea,button{font:inherit;border:1px solid #b9c9bc;border-radius:9px;padding:12px;width:100%;background:white;color:inherit}button{background:#174d38;color:white;margin-top:12px;cursor:pointer}textarea{min-height:90px}article{border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}article button{width:auto;background:white;color:#173e30}small{color:#52665b}a{color:#174d38}</style></head><body><main><header><img src="icon.png" alt="">Receipts Desk</header><h1>Choose a social site</h1><p>Show the receipts.</p><nav id="sites"></nav><p><small>Links open the real platforms. This web version cannot read or filter their feeds. Save and check findings below; no sample posts or simulated verification.</small></p><section><h2>Manage evidence</h2><form id="form"><label for="site">Platform</label><select id="site"></select><label for="claim">Exact post or paragraph text</label><textarea id="claim" required></textarea><label for="source">HTTPS evidence link</label><input id="source" type="url" required placeholder="https://"><label for="finding">Your finding</label><select id="finding"><option>Refuted</option><option>Supported</option></select><button>Save finding</button></form><p id="status" role="status"></p></section><section><h2>Check a post</h2><label for="checkSite">Platform</label><select id="checkSite"></select><label for="check">Paste post text</label><textarea id="check"></textarea><button id="match">Check saved findings</button><p id="result" role="status"></p></section><section><h2>Saved findings</h2><div id="records"></div></section></main><script src="platforms.js"></script><script>const $=id=>document.getElementById(id);let records=[];try{records=JSON.parse(localStorage.getItem('receipts.evidence.web')||'[]')}catch{};const norm=s=>s.normalize('NFKC').trim().replace(/\s+/g,' ');for(const [name,host] of platforms){let a=document.createElement('a');a.href='https://'+host;a.target='_blank';a.rel='noopener noreferrer';let img=document.createElement('img');img.src='https://www.google.com/s2/favicons?sz=64&domain='+encodeURIComponent(host);img.alt='';img.onerror=()=>img.remove();a.append(img,document.createTextNode(name));$('sites').append(a);for(const id of ['site','checkSite'])$(id).add(new Option(name,host))}function save(){try{localStorage.setItem('receipts.evidence.web',JSON.stringify(records));return true}catch{return false}}function render(){let box=$('records');box.replaceChildren();if(!records.length)box.textContent='No findings yet.';records.forEach((r,i)=>{let a=document.createElement('article'),t=document.createElement('p'),l=document.createElement('a'),b=document.createElement('button');t.textContent=r.finding+' · '+r.host+' — '+r.text;l.href=r.source;l.textContent='View evidence';l.target='_blank';l.rel='noopener noreferrer';b.textContent='Delete';b.onclick=()=>{records.splice(i,1);save();render()};a.append(t,l,document.createElement('br'),b);box.append(a)})} $('form').onsubmit=e=>{e.preventDefault();let u;try{u=new URL($('source').value);if(u.protocol!=='https:'||u.username||u.password)throw 0}catch{$('status').textContent='Enter a valid HTTPS evidence link.';return}let text=norm($('claim').value),host=$('site').value;if(!text)return;records=records.filter(r=>r.host!==host||r.text!==text);records.push({host,text,source:u.href,finding:$('finding').value});$('status').textContent=save()?'Finding saved on this device.':'Finding saved for this session only.';render();$('claim').value='';$('source').value=''};$('match').onclick=()=>{let r=records.find(r=>r.host===$('checkSite').value&&r.text===norm($('check').value));$('result').textContent=r?'Your saved finding: '+r.finding+' — see evidence below.':'No matching saved finding. This does not establish whether the claim is true or false.'};render();</script></body></html>
